server:
  port: 8080

spring:
  application:
    name: cloudcart-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloudcart}
    username: ${DB_USER:cloudcart}
    password: ${DB_PASSWORD:cloudcartpass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never


