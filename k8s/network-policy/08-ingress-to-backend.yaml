apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: cloudcart-ingress-to-backend
  namespace: cloudcart

spec:
  podSelector:
    matchLabels:
      app: cloudcart-backend

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx

          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller

      ports:
        - protocol: TCP
          port: 8080

