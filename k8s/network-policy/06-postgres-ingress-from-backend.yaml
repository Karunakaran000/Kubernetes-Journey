apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: cloudcart-postgres-ingress-from-backend
  namespace: cloudcart

spec:
  podSelector:
    matchLabels:
      app: postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudcart-backend

      ports:
        - protocol: TCP
          port: 5432

