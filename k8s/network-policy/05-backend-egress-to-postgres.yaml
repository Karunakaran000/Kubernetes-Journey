apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: cloudcart-backend-egress-to-postgres
  namespace: cloudcart

spec:
  podSelector:
    matchLabels:
      app: cloudcart-backend

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres

      ports:
        - protocol: TCP
          port: 5432

