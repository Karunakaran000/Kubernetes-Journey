apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-demo
  namespace: cloudcart

spec:
  serviceName: storage-demo
  replicas: 1

  selector:
    matchLabels:
      app: storage-demo

  template:
    metadata:
      labels:
        app: storage-demo

    spec:
      containers:
        - name: writer
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Pod identity: $(hostname)" > /data/identity.txt
              sleep 3600

          volumeMounts:
            - name: data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi

